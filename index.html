<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妹妹的生字闖關</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap">
<style>
:root{--bg:#e3ecd3;--paper:#fcfdf5;--ink:#1c2a1f;--ink2:#4b5f4e;--line:#c3d2ae;--line2:#8fa57f;--accent:#ee7d1a;--on-accent:#1c2a1f;
  --ui:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121c16;--paper:#1b2a21;--ink:#e9f2e1;--ink2:#a9bda9;--line:#2f4437;--line2:#5d7a66;--accent:#f59a3e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;
  padding:32px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
main{max-width:520px;margin:0 auto;display:grid;gap:14px}
.eyebrow{font-size:.8rem;letter-spacing:.14em;color:var(--ink2);margin:0}
h1{font-size:clamp(1.9rem,8vw,2.4rem);font-weight:900;line-height:1.15;margin:0}
p{margin:0;color:var(--ink2)}
a.card{display:grid;gap:2px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px;color:inherit;text-decoration:none}
a.card.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
a.card b{font-size:1.25rem;font-weight:900}
a.card span{font-size:.92rem;opacity:.85}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">國語　我會寫字</p>
  <h1>妹妹的生字闖關</h1>
  <p>選一份開始玩。星星和錯題記錄會存在這支手機或平板的瀏覽器裡。</p>
  <a class="card main" href="lesson7-12.html"><b>第 7 到 12 課</b><span>90 個生字，選擇題、描紅默寫、手寫部首</span></a>
  <a class="card" href="lesson1.html"><b>第一份生字</b><span>90 個生字，選擇題、描紅默寫、手寫部首</span></a>
</main>
</body>
</html>
